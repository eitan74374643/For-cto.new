<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Grid World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 300px;
            z-index: 100;
        }
        #controls h1 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #333;
        }
        #controls p {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        #controls code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        #controls .section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        #controls .section-title {
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h1>🎮 Grid World Controls</h1>
        <p>Use <code>moveAgent('up'|'down'|'left'|'right')</code> to move the AI agent.</p>
        <p>Use <code>spawnBlock(x, y, z, color)</code> to add blocks.</p>
        
        <div class="section">
            <div class="section-title">Examples (try in console):</div>
            <p><code>moveAgent('right')</code></p>
            <p><code>moveAgent('up')</code></p>
            <p><code>spawnBlock(2, 1, 2, '#FF6B6B')</code></p>
            <p><code>spawnBlock(-3, 1, 1, '#4ECDC4')</code></p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
